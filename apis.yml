description: "BlueStone is one of India's largest online retailers of fine jewellery, founded in 2011 by
  Gaurav Singh Kushwaha and headquartered in Bangalore. It runs an omnichannel model spanning its e-commerce
  storefront and 125+ physical stores across India, offering 7,000+ BIS-hallmarked and certified designs in
  gold, diamond, gemstone, and platinum, plus services such as lifetime exchange, buyback, 30-day returns, and
  personal video consultations. The company is backed by Accel. BlueStone publishes no public developer portal
  or API; this profile captures the company's identity and a probed domain-security posture for the network."
